[project]
name = "comunidade-game-backend"
version = "0.1.0"
description = "Backend API do Comunidade Game — o núcleo que todas as aplicações consomem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "google-auth>=2.34",
    "google-cloud-storage>=2.18",
    # Runtime, não teste: `sessoes/social.py` importa httpx em tempo de módulo
    # para verificar o token do login social. Sem ele o núcleo não sobe.
    "httpx>=0.27",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Laço local silencioso: sem cabeçalho, sem rastro longo e sem cobertura. A cobertura é
# medida no CI (`.github/workflows/backend-ci.yml`), que roda com `--cov`.
addopts = "-q --no-header --tb=short"
testpaths = ["tests"]
markers = [
    "banco_compartilhado: teste precisa de uma segunda conexão vendo dado realmente gravado; paga TRUNCATE no teardown (design.md — Decisions 4).",
]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nucleo"]
