# Verificação de links da documentação (lychee).
# Executado no CI e disponível localmente: lychee --config lychee.toml .

max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 20

# Alguns sites respondem 403 a HEAD, mas aceitam GET.
method = "get"
user_agent = "Mozilla/5.0 (compatible; lychee link checker; comunidade-game docs)"

# Só 2xx é sucesso; 429 é limite de taxa, não link quebrado.
accept = ["200..=299", "429"]

# Verifica também as âncoras (#secao) dos links, não só o arquivo de destino.
include_fragments = "full"

# `openspec/` fica fora do lint de documentação (CLAUDE.md) e não tem links.
# `apps/` e `jogos/` têm esteira própria (Biome + Vitest); seus HTML de entrada usam
# links raiz-relativos (ex.: `/favicon.svg`) que o Vite resolve, mas que o lychee não
# consegue resolver em arquivo local sem um root dir por aplicação.
exclude_path = ["node_modules", "site", ".venv", "openspec", "apps", "jogos"]
