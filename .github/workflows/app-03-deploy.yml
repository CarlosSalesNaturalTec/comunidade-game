name: App 03 Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/app-03-gestao/**"
      - "comum/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/app-03-deploy.yml"
  workflow_dispatch:

concurrency:
  group: app-03-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build e publicação no Firebase Hosting
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build de produção
        working-directory: apps/app-03-gestao
        env:
          VITE_CHAVE_DE_APLICACAO: ${{ secrets.APP03_CHAVE_DE_APLICACAO }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # TEMPORÁRIO — reverter para https://api.comunidadegame.org assim que
          # o TI liberar o domínio no filtro web.
          #
          # O FortiGate da rede corporativa responde o DNS de
          # `*.comunidadegame.org` com o endereço da própria página de bloqueio
          # (208.91.112.55) e apresenta o certificado do appliance, o que
          # derruba a chamada ao núcleo com ERR_CERT_AUTHORITY_INVALID. O
          # domínio é recém-registrado, e o FortiGuard bloqueia essa categoria
          # por padrão. Não há defeito no Firebase: o certificado de
          # `api.comunidadegame.org` é do Google Trust Services e é válido.
          # `.web.app` já é categorizado e passa no filtro, então serve de
          # contorno para conferir as fatias de dentro da rede corporativa.
          VITE_URL_DO_NUCLEO: https://comunidade-game-api.web.app
        run: npm run build

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Firebase CLI direto, e não `FirebaseExtended/action-hosting-deploy`:
      # aquela ação exige `firebaseServiceAccount`, uma chave JSON de conta de
      # serviço — justamente o que a Workload Identity Federation existe para
      # evitar. O CLI honra as credenciais que o passo anterior exportou em
      # GOOGLE_APPLICATION_CREDENTIALS.
      #
      # Versão exata, e não `@latest` nem faixa `^`: a CLI é baixada a cada
      # publicação, e sem fixá-la o comportamento do deploy muda sozinho entre
      # duas execuções. Subir a versão é ato revisado (design — Decisions).
      - name: Publicar no Firebase Hosting
        run: |
          npx --yes firebase-tools@15.28.1 deploy \
            --only hosting:app-03 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive
