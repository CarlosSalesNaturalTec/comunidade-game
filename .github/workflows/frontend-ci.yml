name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "comum/**"
      - "apps/**"
      - "jogos/**"
      - "package.json"
      - "package-lock.json"
      - "biome.jsonc"
  push:
    branches: [main]
    paths:
      - "comum/**"
      - "apps/**"
      - "jogos/**"
      - "package.json"
      - "package-lock.json"
      - "biome.jsonc"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Biome + Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: biome format --check
        run: npx biome format comum apps

      - name: biome check
        run: npx biome check comum apps

      # O build da App 06 lê o núcleo para pôr o institucional e a casca das
      # comunidades no documento, e **para de propósito** quando ele não
      # responde: página indexada vazia é pior do que não publicar. Aqui não
      # há núcleo de verdade para alcançar, e o build serve só para conferir
      # tipo e montagem — então sobe o mesmo núcleo de mentira que o teste da
      # saída do build usa.
      - name: Núcleo de mentira para o build da App 06
        run: node apps/app-06-vitrine/src/testes/nucleoDeMentira.mjs &

      # `tsc -b` nas seis aplicações sobre Vite, `astro check` na App 06: é o
      # que a esteira de publicação roda antes de construir, e alcança os
      # arquivos de teste, que o Vitest executa sem conferir tipo. Rodá-lo
      # aqui é o que faz o erro de tipo barrar o PR em vez de quebrar a
      # publicação depois do merge.
      - name: Verificação de tipos e build
        env:
          VITE_URL_DO_NUCLEO: http://127.0.0.1:4611
          VITE_CHAVE_DE_APLICACAO: chave-da-esteira
          NO_PROXY: 127.0.0.1,localhost
        run: npm run build --workspaces --if-present

      # A cobertura é medida aqui, e só aqui, sem limiar que bloqueie no
      # Ciclo 01 — o número fica publicado no log (mesma régua do backend).
      # `--workspaces --if-present` alcança cada aplicação nova sem editar
      # este workflow (design — Risks).
      - name: vitest run (com cobertura)
        run: npm run test --workspaces --if-present -- --coverage
