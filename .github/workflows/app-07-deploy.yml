name: App 07 Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/app-07-responsaveis/**"
      - "comum/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/app-07-deploy.yml"
  workflow_dispatch:
  # Chamado pelo `producao-deploy.yml`; `push` e `workflow_dispatch` publicam
  # na homologação (change `ambiente-de-homologacao`, design — decisão 4).
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      versao:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build e publicação no Firebase Hosting
    runs-on: ubuntu-latest
    # Os segredos de mesmo nome (`APPNN_CHAVE_DE_APLICACAO`) têm valor
    # próprio em cada _environment_ do GitHub.
    environment: ${{ inputs.ambiente || 'homologacao' }}
    concurrency:
      group: app-07-deploy-${{ inputs.ambiente || 'homologacao' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      # Sites e alvos derivam do ambiente: `cg-hml-*` e sufixo `-homologacao`
      # na homologação (design — decisão 3).
      - name: Endereços do ambiente
        env:
          AMBIENTE: ${{ inputs.ambiente || 'homologacao' }}
        run: |
          case "$AMBIENTE" in
            homologacao) PREFIXO="cg-hml"; SUFIXO="-homologacao" ;;
            producao) PREFIXO="comunidade-game"; SUFIXO="" ;;
            *) echo "::error::Ambiente desconhecido: $AMBIENTE"; exit 1 ;;
          esac
          {
            echo "PREFIXO_DO_SITE=$PREFIXO"
            echo "SUFIXO_DO_ALVO=$SUFIXO"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          # Fixo, nunca `lts/*`: em 2026-11-03 o runner adotou o Node 26
          # sozinho, que define `localStorage` como getter devolvendo
          # `undefined` sem `--localstorage-file`. O Vitest então não
          # instala o do jsdom, e doze testes da App 09 caíram sem que
          # uma linha do repositório tivesse mudado. Subir é ato revisado.
          node-version: "24"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build
        working-directory: apps/app-07-responsaveis
        env:
          VITE_CHAVE_DE_APLICACAO: ${{ secrets.APP07_CHAVE_DE_APLICACAO }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # TEMPORÁRIO — reverter para https://api.comunidadegame.org assim que
          # o TI liberar o domínio no filtro web. Mesmo contorno do
          # app-01-deploy.yml, do app-03-deploy.yml, do app-05-deploy.yml e do
          # app-09-deploy.yml: o FortiGate da rede corporativa bloqueia
          # `*.comunidadegame.org` por ser domínio recém-registrado, e
          # `.web.app` já é categorizado e passa no filtro.
          VITE_URL_DO_NUCLEO: https://${{ env.PREFIXO_DO_SITE }}-api.web.app
        run: npm run build

      - name: Autenticar no Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Firebase CLI direto, e não `FirebaseExtended/action-hosting-deploy`:
      # aquela ação exige `firebaseServiceAccount`, uma chave JSON de conta de
      # serviço — justamente o que a Workload Identity Federation existe para
      # evitar. O CLI honra as credenciais que o passo anterior exportou em
      # GOOGLE_APPLICATION_CREDENTIALS.
      #
      # Versão exata, e não `@latest` nem faixa `^`: a CLI é baixada a cada
      # publicação, e sem fixá-la o comportamento do deploy muda sozinho entre
      # duas execuções. Subir a versão é ato revisado (design — Decisions),
      # e a mesma versão das demais esteiras de deploy mantém todas iguais.
      - name: Publicar no Firebase Hosting
        run: |
          npx --yes firebase-tools@15.28.1 deploy \
            --only "hosting:responsavel${{ env.SUFIXO_DO_ALVO }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --non-interactive
