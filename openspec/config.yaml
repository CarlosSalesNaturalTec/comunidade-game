schema: spec-driven

# Contexto do projeto — mostrado à IA ao criar qualquer artefato.
# As regras gerais do repositório estão em `CLAUDE.md`, que já está no contexto da sessão:
# este arquivo não as repete. Aqui fica só o que muda a escrita de um artefato.
context: |
  PROJETO
  Comunidade Game — plataforma educacional gamificada, open source, para comunidades
  periféricas. Escopo em execução: Ciclo 01 (Case Guerreira Zeferina, ago–dez/2026),
  com oito aplicações Web (Apps 01, 03, 04, 05, 06, 07, 08 e 09) e o Backend API.

  FONTE DA VERDADE E AUTORIDADE
  `docs/prds/` é a fonte da verdade da implementação: implementa-se o que está escrito nos
  PRDs — nada além, nada diferente. A hierarquia de autoridade, o fluxo de decisão nova e o
  ritmo de verificação estão em `CLAUDE.md`; siga-os sem repeti-los no artefato.

  NENHUM ARTEFATO DO OPENSPEC CRIA REGRA
  Proposal, specs, design e tasks não definem regra de produto, número, prazo, provedor ou
  comportamento que não esteja no PRD. Faltou requisito, há ambiguidade ou contradição com o
  PRD: PARE e pergunte ao fundador. Não preencha lacuna com suposição.

  LEITURA DIRIGIDA — o que abrir antes de escrever
  1. `docs/prds/index.md` — situação de cada PRD e ordem das ondas.
  2. Do PRD alvo: a §14 (pendências que permanecem), as seções que cobrem os RF/RN do
     recorte e, quando houver contrato de API, a §9. O PRD inteiro só quando a fatia
     atravessar o documento todo. Leia o PRD UMA vez por change, não uma vez por artefato.
  3. `docs/99-mapa-de-referencias.md` §§4, 5, 6 e 8.
  4. `openspec/specs/<capability>/spec.md` para saber o que já existe — é o consolidado.
     `openspec/changes/archive/` é histórico: só abra quando precisar do porquê de uma
     decisão.

  INVARIANTES (documento 99 §6 — resumo; valem para o código como valem para o texto)
  Oito aplicações Web responsivas Mobile First, sem app nativo e sem mensageria de terceiros;
  faixa de 6 a 16 anos com progressão por dificuldade; só o Guerreiro(a) tem autocadastro, e
  login não cria cadastro; toda trilha abre em sondagem, tem coleta de dados reais e termina
  em criação original; guarda permanente do dado de território com anonimização apenas na
  saída, e revogação que despersonaliza sem apagar; App 04 (jogo) público, sem login de pessoa
  e somente leitura, sem endpoint de escrita; nenhuma atividade sem lastro; nenhum contato
  direto entre Apoiador e Guerreiro(a); Guerreiros e Guerreiras aparecem em público só por
  avatar e nick; aporte exibido em moedas, nunca em reais; ponto regular nunca se gasta e só
  o extra se troca, por recompensa avulsa e nunca por recompensa de marco; personalização por
  IA que adapta na sessão e não perfila a criança. Contrariar um deles é defeito.

  DECISÕES TÉCNICAS JÁ VIGENTES (documento 03 — aplique, não reabra)
  - Backend em forma de API, versionada na rota, começando em `/v1`. Documentada em OpenAPI
    desde o primeiro endpoint; o schema e a interface ficam FORA do `/v1` e abertos, sem
    chave. A exigência de chave alcança as rotas de dados sob `/v1`, inclusive as públicas.
  - Toda aplicação consumidora se identifica por chave, inclusive as do projeto; sem chave
    válida a API não responde. Escrita e gestão exigem também a credencial da persona. A
    chave é por aplicação E por ambiente — dois ambientes no Ciclo 01 (desenvolvimento em
    contêiner local e produção no Cloud Run), o que dá 16 chaves semeadas na implantação.
  - Frontends independentes, em endereços próprios; a vitrine ocupa a raiz de
    `comunidadegame.org`.
  - Autenticação por persona: Guerreiro(a) por nick e imagem; Mestre, Apoiador e Admin por
    login social (Google); responsável por login social ou usuário e senha criados por Admin
    ou Mestre. Apps 04 e 06 não têm login.
  - Uma única instância para todas as comunidades; Comunidade Virtual é vínculo no registro,
    e toda consulta filtra por comunidade.
  - Registro de custos em tudo: toda ação com custo entra no livro-razão (PRD-07).
  - Séries temporais georreferenciadas como cidadão de primeira classe no modelo de dados.
  - Stack e hospedagem do Ciclo 01: Python com FastAPI no Cloud Run, Cloud SQL para
    PostgreSQL com PostGIS e Cloud Storage, tudo em `southamerica-east1`. As séries temporais
    do território ficam no próprio PostgreSQL, particionadas por tempo. Contêiner e banco
    portáteis, para que outra comunidade replique fora do Google Cloud.
  - Reconhecimento facial do App 01 no próprio aparelho, pela biblioteca aberta Human, na
    ordem prova de vivacidade e depois descritor facial. Ao núcleo vai apenas o descritor — a
    fotografia não trafega —, a comparação acontece no núcleo e nenhuma rota devolve o
    _template_. Sem provedor externo e sem custo de nuvem.
  - Modelos de IA do Ciclo 01: Google Gemini, com custo lançado no livro-razão como cloud.
  - Código aberto; conteúdo educacional publicado sob CC BY-SA.
  - Monorepo com uma pasta por aplicação: `backend/`, `apps/app-NN-*/`, `jogos/app-04-arena/`,
    `comum/`, `docs/` e `openspec/` (documento 03 §1.2). Não invente pasta nova de topo; o jogo
    fica em `jogos/`, não em `apps/`.
  - Ferramentas do backend: Python 3.12, Ruff (conjuntos `E`, `F`, `I`, `UP`, `B`) e pytest.
    Ferramentas dos frontends e do jogo: Biome (formatador e _linter_) e Vitest, com as três
    verificações — `biome format`, `biome check`, `vitest run` — bloqueando o _merge_
    (documento 09).

  ORDEM DE CONSTRUÇÃO
  Está no documento 99 §9, com o piso de dependência de cada PRD. NÃO é a ordem de elaboração
  do documento 08. A situação de cada PRD está em `docs/prds/index.md`, e as changes em
  andamento em `openspec list`; nenhuma das duas se repete aqui, para não envelhecer.

  PENDÊNCIAS — ONDE PROCURAR ANTES DE SUPOR
  O que segue em aberto está na §14 do PRD alvo (o que trava aquele PRD) e em
  `docs/09-topicos-em-aberto-e-sugestoes.md` §1 (a pauta do fundador); a lista não se repete
  aqui para não envelhecer. Se uma pendência atinge o recorte da change, PARE e pergunte:
  nenhuma se resolve dentro de um artefato do OpenSpec.

  Parâmetro que a documentação deixa de propósito para a operação declarar — a duração da
  sessão do Guerreiro(a) (RF-01-04), o prazo da versão anterior da API (RF-01-31), os valores
  de tabela cadastrados pela gestão — não é pendência de decisão de produto: vira parâmetro de
  configuração. Não trave a change por causa dele e não invente o número: pergunte o valor
  inicial ao fundador.

  IDIOMA
  Português do Brasil em artefatos, documentação, comentários e mensagens de commit. Os
  termos do domínio são preservados: Guerreiro(a), Mestre, Apoiador, Admin, responsável,
  Comunidade Virtual, trilha, missão, desafio, poder, badge, moeda, lastro, livro-razão.

  ECONOMIA DE CONTEXTO
  O artefato é plano de execução, não redação. Cite o identificador em vez de copiar o texto
  normativo, escreva o suficiente para a tarefa ser executável e pare. Não abra subagente
  para escrever, sincronizar ou arquivar: o agente da sessão já tem o contexto.

# Regras por artefato.
rules:
  proposal:
    - >-
      Toda proposta declara, na abertura, o PRD que a origina e os identificadores
      (RF-XX-nn, RN-XX-nn) que serão atendidos. Proposta sem âncora em PRD é inválida.
    - >-
      O escopo de uma change é um recorte de um PRD; respeite a ordem das ondas e as
      dependências entre PRDs do documento 99 §8.
    - >-
      A seção de fora do escopo reproduz o que o PRD já exclui (seção 3.2 do PRD), sem
      inventar exclusão nova.
    - >-
      Não copie texto normativo do PRD nem dos documentos 01–15 — cite o identificador.
    - >-
      Requisito que você gostaria de ter e não existe no PRD não entra na proposta: ele
      vira pergunta ao fundador.
  specs:
    - >-
      Cada requisito do delta aponta o RF/RN do PRD que o origina; requisito sem origem
      em PRD é sinal de PRD incompleto — pare e pergunte.
    - >-
      Os cenários de aceite derivam dos critérios de aceite do PRD (seção 12) e das
      regras de negócio (seção 7); não crie critério novo.
    - >-
      Dado pessoal de criança segue a seção 11 do PRD e o documento 03 §12; consentimento,
      anonimização na saída e prazo de guarda são requisito, não detalhe de implementação.
    - >-
      Mantenha o vocabulário do domínio em português; não renomeie conceito do PRD.
  design:
    - >-
      O desenho respeita os princípios de arquitetura do documento 03 §1 e os contratos
      de API declarados no PRD (seção 9) e no PRD-01.
    - >-
      Não escolha linguagem, framework, banco, provedor ou serviço que não esteja
      decidido nos documentos; pendência do documento 09 vira pergunta, nunca suposição.
    - >-
      Registre alternativas descartadas em uma linha cada; justificativa longa não é
      artefato deste projeto.
    - >-
      Toda operação com custo prevê o lançamento no livro-razão; todo dado de território
      prevê série temporal com coletor identificado.
    - >-
      O `design.md` cobre o que a fatia decide, não o que já está decidido. Fatia que apenas
      aplica um padrão consolidado em `openspec/specs/` sai com meia página: Context aponta a
      spec que já existe, Decisions traz só a escolha nova e o resto some.
  tasks:
    - >-
      Cada tarefa cita o identificador que atende (RF-XX-nn ou RN-XX-nn) e tem resultado
      verificável.
    - >-
      Uma tarefa é uma unidade de trabalho, não uma asserção. Agrupe por arquivo de código
      ou por comportamento e liste os identificadores da tarefa juntos; uma fatia normal
      fecha em torno de 10 a 15 tarefas, não em 30.
    - >-
      A seção de testes traz uma tarefa por arquivo de teste ou por grupo de cenários
      relacionados, com os cenários citados dentro da tarefa. Não crie uma tarefa por
      cenário de aceite.
    - >-
      Para cada requisito coberto existe verificação correspondente ao critério de aceite do
      PRD — dentro da tarefa de teste do grupo dele, não numa tarefa separada.
    - >-
      Não crie tarefa para rodar esteira: o ritmo de verificação de `CLAUDE.md` já define o
      que roda e quando. Nenhuma tarefa diz "rodar ruff, pytest, npm run lint ou mkdocs".
    - >-
      Toda change termina com uma tarefa de documentação: atualizar em `docs/` apenas o que
      a change mudou — documento-fonte e documento 09 quando houve decisão nova, o PRD
      afetado, `docs/prds/index.md` se a situação mudou, o documento 99 se a relação entre
      documentos mudou e a `nav` do `mkdocs.yml` se nasceu arquivo novo. Se a change não
      mudou nada disso, a tarefa diz isso em uma linha.
    - >-
      Não crie documento técnico novo em `docs/`: essa pasta é a documentação do produto e
      só recebe arquivo novo por decisão do fundador. O plano de execução fica na change.
    - >-
      Não crie tarefa fora do escopo declarado na proposal.

# Orientação por operação — vale na implementação e no arquivamento, não na escrita
# dos artefatos.
operations:
  apply:
    guidance:
      - >-
        Implemente apenas as tarefas aprovadas. Requisito faltando, ambíguo ou em
        contradição com o PRD não se resolve no código: pare e pergunte ao fundador.
      - >-
        Encadeie as tarefas: implemente o bloco inteiro de um arquivo antes de verificar, e
        marque `- [x]` em lote. Não pare a cada linha para conferir o que ainda vai mudar.
      - >-
        Ritmo de verificação (detalhe em `CLAUDE.md`): durante o laço, rode só os testes do
        recorte (`uv run pytest tests/test_<arquivo>.py -x`); ao fechar as tarefas, rode uma
        única vez `ruff format .`, `ruff check --fix .` e `pytest` no `backend/`. Teste
        quebrado se resolve com `uv run pytest --lf -x`, não com a suíte inteira.
      - >-
        `npm run fix`, `npm run lint` e `mkdocs build --strict` só quando a change tocou
        `docs/`, `mkdocs.yml` ou `.md` da raiz. `openspec/` fica fora do lint e do site.
      - >-
        Toda mudança em `docs/` que a change provocou entra no mesmo PR — o site do MkDocs
        nunca fica atrasado em relação ao que foi implementado.
      - >-
        Um branch e um PR por change. Merge sempre por merge commit, nunca squash.
  archive:
    guidance:
      - >-
        Quando só existe uma change ativa, use-a sem perguntar; a pergunta de seleção só
        vale quando há mais de uma.
      - >-
        `/opsx:verify` confere o diff da change (`git diff --stat main...HEAD`) contra
        `tasks.md` e as specs do delta. NÃO refaça varredura de palavra-chave pelo código
        inteiro e NÃO re-execute teste, lint ou build: se a árvore não mudou desde a última
        suíte verde, o resultado já é conhecido.
      - >-
        Sincronize as specs no próprio agente da sessão — não abra subagente para isso.
      - >-
        Confira que `docs/prds/index.md` e o documento 99 refletem a situação e que todo
        arquivo novo de `docs/` está na `nav` do `mkdocs.yml`.
